<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢字テスト練習アプリ</title>
<style>
  body { font-family: sans-serif; text-align: center; padding: 10px; touch-action: none; background-color: #f9f9f9; }
  
  /* 左上のリセットボタン */
  .reset-container { position: absolute; top: 10px; left: 10px; }
  .reset-btn { padding: 5px 10px; font-size: 12px; background: #eee; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; color: #666; }
  
  #question-box { margin-top: 40px; margin-bottom: 10px; }
  #question { font-size: 24px; font-weight: bold; color: #333; }
  #hints { font-size: 16px; color: #555; margin: 5px; text-align: left; display: inline-block; }
  
  #area { display: flex; justify-content: center; align-items: center; gap: 20px; flex-wrap: wrap; }
  #canvas { border: 2px solid #333; background: #fff; touch-action: none; border-radius: 8px; }
  
  /* 解答・書き順エリア */
  #answer-area { display: flex; gap: 10px; align-items: center; }
  #answer-display { font-size: 80px; width: 150px; height: 150px; display: flex; align-items: center; justify-content: center; border: 2px dashed #999; background: #fff; color: #d32f2f; font-weight: bold; border-radius: 8px; }
  #stroke-order-display { width: 150px; height: 150px; border: 2px dashed #999; background: #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #stroke-order-display img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
  #stroke-order-placeholder { color: #999; font-size: 14px; text-align: center; padding: 10px; }

  .controls { margin-top: 20px; }
  button { padding: 15px 25px; font-size: 18px; margin: 5px; cursor: pointer; border-radius: 8px; border: none; background: #007bff; color: white; }
  .clear { background: #6c757d; }
  .check { background: #28a745; }
</style>
</head>
<body>

  <button class="reset-btn" onclick="resetQuiz()">最初に戻る</button>
</div>

  <div id="hints"></div>
</div>

  <canvas id="canvas" width="300" height="300"></canvas>

    <div id="stroke-order-display">
      <div id="stroke-order-placeholder">書き順</div>
      <img id="stroke-order-img" src="" alt="書き順">
    </div>
  </div>
</div>

<div class="controls">
  <button class="clear" onclick="clearCanvas()">やりなおし</button>
  <button class="check" onclick="showAnswer()">こたえを見る</button>
  <button onclick="nextQuestion()">次の問題へ</button>
</div>

    { q: ["[ご]ぜん", "おひるの12時[まえ]"], a: "前", code: "524d" }
  ];
  
  let currentIdx = 0;
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let painting = false;

  ctx.strokeStyle = "black";
  ctx.lineWidth = 12;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  // 手書き処理（指や手のひら[touch]を無視し、ペン[pen]の入力だけを受け付ける）
  canvas.addEventListener('pointerdown', (e) => { 
    if (e.pointerType !== 'pen') return;
    painting = true; 
    draw(e); 
  });
  canvas.addEventListener('pointerup', () => { 
    painting = false; 
    ctx.beginPath(); 
  });
  canvas.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'pen') return;
    draw(e);
  });

  function draw(e) {
    if (!painting) return;
    const rect = canvas.getBoundingClientRect();
    ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
  }

  function clearCanvas() { 
    ctx.clearRect(0, 0, canvas.width, canvas.height); 
    document.getElementById('answer-display').innerText = "?";
    
    // 書き順画像の非表示・リセット
    document.getElementById('stroke-order-img').style.display = "none";
    document.getElementById('stroke-order-placeholder').style.display = "block";
  }

  function showAnswer() {
    const currentData = quizData[currentIdx];
    document.getElementById('answer-display').innerText = currentData.a;
    
    // 書き順アニメーション・画像の読み込み（オープンソースのKanjiVGリソースを活用）
    const imgElement = document.getElementById('stroke-order-img');
    const placeholder = document.getElementById('stroke-order-placeholder');
    
    if (currentData.code && currentData.code !== "7糸") {
      // Unicodeをもとにした stroke-order 用のSVG画像パスを生成
      const paddedCode = currentData.code.padStart(5, '0');
      imgElement.src = `https://raw.githubusercontent.com/KanjiVG/KanjiVG/master/kanji/${paddedCode}.svg`;
      imgElement.style.display = "block";
      placeholder.style.display = "none";
    } else {
      // 「糸」など一部例外用
      imgElement.src = `https://raw.githubusercontent.com/KanjiVG/KanjiVG/master/kanji/07cf8.svg`;
      imgElement.style.display = "block";
      placeholder.style.display = "none";
    }
  }

  function resetQuiz() {
    currentIdx = 0;
    updateQuestion();
  }

  function updateQuestion() {
    document.getElementById('question').innerText = "もんだい " + (currentIdx + 1);
    document.getElementById('hints').innerHTML = quizData[currentIdx].q.join("<br>");
    clearCanvas();
  }

  function nextQuestion() {
    currentIdx = (currentIdx + 1) % quizData.length;
    updateQuestion();
  }

  updateQuestion();
</script>
</body>
</html>
