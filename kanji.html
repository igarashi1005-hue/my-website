<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢字テスト練習アプリ v1.4.2</title>
<style>
  /* 画面全体で長押し選択やメニューを禁止する対策 */
  body { 
    font-family: sans-serif; 
    text-align: center; 
    padding: 10px; 
    touch-action: none; 
    background-color: #f9f9f9; 
    margin: 0; 
    -webkit-touch-callout: none; /* iOS長押しメニュー禁止 */
    -webkit-user-select: none;   /* Safari選択禁止 */
    user-select: none;           /* 標準の選択禁止 */
  }
  
  .top-controls { margin-top: 10px; width: 100%; display: flex; justify-content: center; }
  .load-btn { padding: 10px 20px; font-size: 16px; background: #9c27b0; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; }
  #file-selector-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
  .modal-content { background: white; padding: 20px; border-radius: 12px; width: 85%; max-width: 320px; }
  .file-item { padding: 12px; background: #f0f0f0; border: 1px solid #ddd; margin-bottom: 8px; border-radius: 6px; cursor: pointer; }
  .control-container { position: absolute; top: 60px; left: 10px; display: flex; flex-direction: column; gap: 5px; }
  .status-container { position: absolute; top: 60px; right: 10px; text-align: right; font-size: 12px; color: #666; }
  #main-layout { display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
  
  /* 手書きキャンバス（ここは文字を書くためにタッチアクションを制御） */
  #canvas { border: 2px solid #333; background: #fff; width: 280px; height: 280px; touch-action: none; }
  
  .controls { margin-top: 20px; width: 100%; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .btn-row { display: flex; gap: 10px; }
  button.action-btn { padding: 15px 25px; font-size: 16px; border-radius: 8px; border: none; color: white; font-weight: bold; }
</style>
</head>
<body>
<div id="file-selector-modal" onclick="this.style.display='none'">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div id="modal-file-list"></div>
  </div>
</div>
<div id="main-layout">
  <div class="top-controls"><button class="load-btn" onclick="openFileSelector()">もんだいを切りかえる</button></div>
  <div class="control-container">
    <button onclick="resetQuiz()">最初に戻る</button>
    <button onclick="forgetAll()">覚えたことを忘れる</button>
  </div>
  <div class="status-container">
    <span id="file-name-display">[ なし ]</span><br>
    <span id="progress-display">しんちょく: 0 / 0</span>
  </div>
  <div id="question-box"><div id="question">もんだいを読み込んでください</div><div id="hints"></div></div>
  <canvas id="canvas" width="280" height="280"></canvas>
  <div id="answer-area">
    <div id="answer-display">?</div>
    <div id="stroke-order-display"><img id="stroke-order-img" src="" style="display:none; width:130px;"></div>
  </div>
  <div class="controls">
    <div class="btn-row">
      <button class="action-btn" style="background:#6c757d" onclick="clearCanvas()">やりなおし</button>
      <button class="action-btn" style="background:#28a745" onclick="showAnswer()">こたえを見る</button>
      <button class="action-btn" style="background:#ff9800" onclick="markAsLearned()">覚えた！</button>
    </div>
    <button class="action-btn" style="background:#007bff; width:280px;" onclick="nextQuestion()">次の問題へ</button>
  </div>
</div>
<script>
  // 長押し時のコンテキストメニュー（システムメニュー）を完全にブロックする
  window.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  });

  const csvFiles = ["小学1年生その1", "小学1年生その2", "小学4年生その1", "小学4年生その2", "小学4年生その3", "小学4年生その4", "小学4年生その5"];
  let quizData = [], learnedSet = new Set(), activeIndices = [], currentActivePointer = 0, currentFileName = "";
  const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
  let painting = false;
  
  canvas.addEventListener('pointerdown', (e) => { if(e.pointerType==='pen'){ painting=true; draw(e); }});
  canvas.addEventListener('pointerup', () => { painting=false; ctx.beginPath(); });
  canvas.addEventListener('pointermove', (e) => { if(painting && e.pointerType==='pen') draw(e); });
  
  function draw(e) {
    const rect = canvas.getBoundingClientRect();
    ctx.lineTo((e.clientX - rect.left)*(canvas.width/rect.width), (e.clientY - rect.top)*(canvas.height/rect.height));
    ctx.stroke(); ctx.beginPath();
  }
  function openFileSelector() {
    const list = document.getElementById('modal-file-list'); list.innerHTML = "";
    csvFiles.forEach(f => {
      const div = document.createElement('div'); div.className="file-item"; div.innerText=f;
      div.onclick = () => { closeModal(); fetchCSV(f); }; list.appendChild(div);
    });
    document.getElementById('file-selector-modal').style.display = "flex";
  }
  function closeModal() { document.getElementById('file-selector-modal').style.display = "none"; }
  function fetchCSV(f) {
    currentFileName = f;
    fetch(`data/${f}.csv`).then(r => r.text()).then(t => {
      quizData = t.split(/\r?\n/).filter(l=>l.trim()).map(l => {
        const c = l.split(','); return { q: c[0].split('|'), a: c[1].trim(), code: c[2].trim() };
      });
      learnedSet.clear(); rebuildActiveList(true); updateQuestion();
    });
  }
  function rebuildActiveList(first) {
    activeIndices = quizData.map((_,i)=>i).filter(i => !learnedSet.has(i));
    if(first) currentActivePointer = 0;
    document.getElementById('progress-display').innerText = `しんちょく: ${learnedSet.size} / ${quizData.length}`;
    document.getElementById('file-name-display').innerText = `[ ${currentFileName} ]`;
  }
  function updateQuestion() {
    if(activeIndices.length===0) return;
    const idx = activeIndices[currentActivePointer];
    document.getElementById('question').innerText = "もんだい " + (idx + 1);
    document.getElementById('hints').innerHTML = quizData[idx].q.join("<br>");
    clearCanvas();
  }
  function showAnswer() {
    const d = quizData[activeIndices[currentActivePointer]];
    document.getElementById('answer-display').innerText = d.a;
    const img = document.getElementById('stroke-order-img');
    img.src = `https://raw.githubusercontent.com/KanjiVG/KanjiVG/master/kanji/${d.code.padStart(5, '0')}.svg`;
    img.style.display = "block";
  }
  function markAsLearned() {
    learnedSet.add(activeIndices[currentActivePointer]);
    rebuildActiveList(false);
    activeIndices.length > 0 ? updateQuestion() : alert("全問クリア！");
  }
  function nextQuestion() { currentActivePointer = (currentActivePointer + 1) % activeIndices.length; updateQuestion(); }
  function resetQuiz() { currentActivePointer = 0; updateQuestion(); }
  function forgetAll() { learnedSet.clear(); rebuildActiveList(true); updateQuestion(); }
  function clearCanvas() { ctx.clearRect(0,0,280,280); ctx.beginPath(); document.getElementById('answer-display').innerText="?"; document.getElementById('stroke-order-img').style.display="none"; }
</script>
</body>
</html>
