<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢字ドリルアプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff6f9c;
    --purple: #a66bff;
    --blue: #3fb6ff;
    --green: #34c77b;
    --orange: #ff9f43;
    --yellow: #ffd23f;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Kosugi Maru', sans-serif;
    text-align: center;
    padding: 10px;
    touch-action: none;
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle, rgba(255,255,255,0.55) 1.5px, transparent 1.6px) 0 0 / 26px 26px,
      linear-gradient(135deg, #fff6e5 0%, #e6f7ff 45%, #ffe9f3 100%);
    background-attachment: fixed, fixed;
    -webkit-touch-callout: none; /* iOS長押しメニュー禁止 */
    -webkit-user-select: none;   /* Safari選択禁止 */
    user-select: none;           /* 標準の選択禁止 */
    position: relative;
    overflow-x: hidden;
  }

  /* ふわふわ浮かぶ背景の飾り（装飾のみ・操作には影響しません） */
  .floaty { position: fixed; font-size: 34px; opacity: 0.35; pointer-events: none; z-index: 0; animation: floaty 6s ease-in-out infinite; }
  .floaty.f1 { top: 8%; left: 4%; animation-delay: 0s; }
  .floaty.f2 { top: 18%; right: 6%; animation-delay: 1.5s; font-size: 26px; }
  .floaty.f3 { bottom: 10%; left: 8%; animation-delay: 3s; font-size: 28px; }
  .floaty.f4 { bottom: 20%; right: 8%; animation-delay: 2s; font-size: 24px; }
  @keyframes floaty {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-14px) rotate(8deg); }
  }

  /* アプリタイトルバナー */
  .app-banner {
    position: relative;
    z-index: 1;
    font-family: 'Mochiy Pop One', 'Kosugi Maru', sans-serif;
    font-size: 20px;
    color: #7a3ea1;
    text-shadow: 1px 1px 0 #fff, 2px 2px 4px rgba(0,0,0,0.08);
    padding: 6px 0 2px;
    letter-spacing: 1px;
  }

  /* 上部のコントロール・ファイル選択エリア */
  .top-controls { margin-top: 6px; width: 100%; display: flex; justify-content: center; position: relative; z-index: 1; }
  .load-btn {
    padding: 12px 26px; font-size: 16px; font-family: inherit;
    background: linear-gradient(135deg, var(--purple), var(--pink));
    border: none; border-radius: 999px; cursor: pointer; color: white; font-weight: bold;
    box-shadow: 0 4px 0 #7a3ea1, 0 6px 10px rgba(0,0,0,0.15);
    transition: transform 0.08s ease;
  }
  .load-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #7a3ea1, 0 2px 4px rgba(0,0,0,0.15); }

  /* 問題選択ポップアップメニュー */
  #file-selector-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(80,40,100,0.45); z-index: 1000; justify-content: center; align-items: center; }
  .modal-content { background: #fffdf7; padding: 20px; border-radius: 20px; width: 85%; max-width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); border: 4px solid #ffe0ef; }
  .modal-title { font-family: 'Mochiy Pop One', 'Kosugi Maru', sans-serif; font-size: 17px; font-weight: bold; margin-bottom: 15px; color: #7a3ea1; }
  .file-list { display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; margin-bottom: 15px; padding: 5px; }
  .file-item {
    padding: 12px 12px 12px 40px; position: relative;
    background: #fff3f9; border-radius: 12px; cursor: pointer; font-size: 15px; font-weight: bold; color: #555;
    border: 2px solid #ffd9ec; text-align: left; transition: transform 0.08s ease, background 0.15s ease;
  }
  .file-item::before { content: "📘"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 16px; }
  .file-item:active { background: #ffe1f0; transform: scale(0.98); }
  /* 学年ごとに色分け（見た目だけの工夫） */
  .file-list .file-item:nth-child(-n+2) { border-color: #ffc2d6; }
  .file-list .file-item:nth-child(n+3):nth-child(-n+6) { border-color: #c6e6ff; }
  .file-list .file-item:nth-child(n+7):nth-child(-n+10) { border-color: #c8f2d8; }
  .file-list .file-item:nth-child(n+11):nth-child(-n+15) { border-color: #ffe6b3; }
  .file-list .file-item:nth-child(n+16):nth-child(-n+19) { border-color: #ffd2ae; }
  .file-list .file-item:nth-child(n+20):nth-child(-n+23) { border-color: #ded0ff; }
  .close-modal-btn { padding: 10px; width: 100%; background: #8a8f98; border: none; color: white; border-radius: 999px; font-size: 14px; font-family: inherit; font-weight: bold; cursor: pointer; }

  /* 左上のコントロールエリア */
  .control-container { position: absolute; top: 60px; left: 10px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; z-index: 1; }
  .reset-btn { padding: 5px 10px; font-size: 11px; font-family: inherit; background: #e8f3ff; border: 1px solid #b7ddff; border-radius: 999px; cursor: pointer; color: #2b7cc7; font-weight: bold; }
  .forget-btn { padding: 5px 10px; font-size: 11px; font-family: inherit; background: #ffeef0; border: 1px solid #ffc7cf; border-radius: 999px; cursor: pointer; color: #d6455e; font-weight: bold; }

  /* 右上のステータスエリア */
  .status-container { position: absolute; top: 60px; right: 10px; text-align: right; font-size: 12px; color: #777; font-weight: bold; line-height: 1.6; z-index: 1; }
  #file-name-display { color: #a66bff; margin-right: 8px; display: inline-block; }
  #progress-display { display: inline-block; background: #fff8e1; border: 1px solid #ffe49b; border-radius: 999px; padding: 3px 10px; }
  #progress-display::before { content: "⭐ "; }
  .version { font-size: 10px; color: #bbb; font-weight: normal; }

  #main-layout { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; max-width: 100%; padding: 0 10px; box-sizing: border-box; }

  #question-box {
    margin-top: 65px; margin-bottom: 15px; width: 100%; max-width: 320px; text-align: center;
    background: #ffffffcc; border-radius: 18px; padding: 14px 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    border: 2px dashed #ffd2ae;
  }
  #question { font-family: 'Mochiy Pop One', 'Kosugi Maru', sans-serif; font-size: 20px; font-weight: bold; color: #ff8a3d; margin-bottom: 8px; }
  #hints { font-size: 15px; color: #555; text-align: left; display: inline-block; line-height: 1.6; }

  /* 手書きキャンバス（げんこうようし風の目安線つき） */
  #canvas {
    border: 4px solid #ffb877; background-color: #fffdf7; touch-action: none; border-radius: 16px; display: block;
    width: 280px; height: 280px; box-shadow: 0 6px 16px rgba(255,150,60,0.25);
    background-image:
      linear-gradient(to right, transparent calc(50% - 1px), rgba(255,150,60,0.35) calc(50% - 1px), rgba(255,150,60,0.35) calc(50% + 1px), transparent calc(50% + 1px)),
      linear-gradient(to bottom, transparent calc(50% - 1px), rgba(255,150,60,0.35) calc(50% - 1px), rgba(255,150,60,0.35) calc(50% + 1px), transparent calc(50% + 1px));
  }

  /* 解答・書き順エリア */
  .answer-labels { display: flex; gap: 10px; justify-content: center; width: 100%; margin-top: 18px; }
  .answer-labels span { width: 135px; font-size: 12px; font-weight: bold; color: #a66bff; }
  #answer-area { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 4px; width: 100%; }
  #answer-display {
    font-size: 70px; width: 135px; height: 135px; display: flex; align-items: center; justify-content: center;
    border: 3px dashed #ffb3cf; background: #fff8fb; color: #ff4d7d; font-weight: bold; border-radius: 16px;
    box-shadow: 0 4px 10px rgba(255,110,150,0.2);
  }
  #stroke-order-display {
    width: 135px; height: 135px; border: 3px dashed #b3d9ff; background: #f5fbff; border-radius: 16px;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    box-shadow: 0 4px 10px rgba(80,160,255,0.2);
  }
  #stroke-order-display img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
  #stroke-order-placeholder { color: #7fb3e6; font-size: 13px; text-align: center; padding: 5px; font-weight: bold; }

  /* コントロールボタン */
  .controls { margin-top: 22px; width: 100%; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .btn-row { display: flex; gap: 10px; justify-content: center; width: 100%; max-width: 280px; }
  button.action-btn {
    flex: 1; padding: 15px 0; font-size: 15px; font-family: inherit; cursor: pointer; border-radius: 999px; border: none;
    color: white; font-weight: bold; transition: transform 0.08s ease;
  }
  button.action-btn:active { transform: translateY(3px) scale(0.98); }
  .clear { background: linear-gradient(135deg, #9aa3ad, #6c757d); box-shadow: 0 4px 0 #565b61; }
  .clear:active { box-shadow: 0 1px 0 #565b61; }
  .check { background: linear-gradient(135deg, #4ee08a, #28a745); box-shadow: 0 4px 0 #1e7a35; }
  .check:active { box-shadow: 0 1px 0 #1e7a35; }
  .learned { background: linear-gradient(135deg, #ffc24e, #ff9800); box-shadow: 0 4px 0 #c97600; animation: pulse 2.4s ease-in-out infinite; }
  .learned:active { box-shadow: 0 1px 0 #c97600; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 4px 0 #c97600, 0 0 0 0 rgba(255,152,0,0.4); }
    50% { box-shadow: 0 4px 0 #c97600, 0 0 0 8px rgba(255,152,0,0); }
  }
  .next {
    background: linear-gradient(135deg, #57c2ff, #007bff); width: 100%; max-width: 280px; padding: 16px 0; font-size: 18px;
    font-family: inherit; cursor: pointer; border-radius: 999px; border: none; color: white; font-weight: bold;
    box-shadow: 0 4px 0 #0056b3; transition: transform 0.08s ease;
  }
  .next:active { transform: translateY(3px) scale(0.98); box-shadow: 0 1px 0 #0056b3; }

  /* 画面がせまいときは左右の情報パネルが重ならないように調整 */
  @media (max-width: 420px) {
    .control-container { gap: 4px; }
    .reset-btn, .forget-btn { font-size: 9px; padding: 4px 6px; }
    .status-container { font-size: 10px; }
    #file-name-display { display: block; margin-right: 0; margin-bottom: 3px; }
    #progress-display { font-size: 10px; padding: 2px 8px; }
  }
</style>
</head>
<body>

<span class="floaty f1">⭐</span>
<span class="floaty f2">🌸</span>
<span class="floaty f3">✏️</span>
<span class="floaty f4">🎈</span>

<div id="file-selector-modal" onclick="closeModal()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-title">📚 ドリル を えらぶ</div>
    <div class="file-list" id="modal-file-list">
      </div>
    <button class="close-modal-btn" onclick="closeModal()">✅ とじる</button>
  </div>
</div>

<div class="app-banner">📖 かんじ ドリル ✏️</div>

<div id="main-layout">
  <div class="top-controls">
    <button class="load-btn" onclick="openFileSelector()">🔄 ドリルをきりかえる</button>
  </div>

  <div class="control-container">
    <button class="reset-btn" onclick="resetQuiz()">↩️ はじめのドリルにもどる</button>
    <button class="forget-btn" onclick="forgetAll()">🗑️ ドリルのきろくを消す</button>
  </div>

  <div class="status-container">
    <div>
      <span id="file-name-display">[ なし ]</span>
      <span id="progress-display">ドリルしんちょく: 0 / 0</span>
    </div>
    <div class="version">v1.5.0</div>
  </div>

  <div id="question-box">
    <div id="question">ドリル を えらんでね</div>
    <div id="hints">の上の「ドリルをきりかえる」ボタンから<br>CSVファイルをえらんでください。</div>
  </div>

  <canvas id="canvas" width="280" height="280"></canvas>

  <div class="answer-labels">
    <span>📝 こたえ</span>
    <span>✍️ 書き順</span>
  </div>
  <div id="answer-area">
    <div id="answer-display">?</div>
    <div id="stroke-order-display">
      <div id="stroke-order-placeholder">書き順</div>
      <img id="stroke-order-img" src="" alt="書き順">
    </div>
  </div>

  <div class="controls">
    <div class="btn-row">
      <button class="action-btn clear" onclick="clearCanvas()">🧹 やりなおし</button>
      <button class="action-btn check" onclick="showAnswer()">👀 こたえを見る</button>
      <button class="action-btn learned" onclick="markAsLearned()">🌟 覚えた！</button>
    </div>
    <button class="next" onclick="nextQuestion()">➡️ つぎのドリルへ</button>
  </div>
</div>

<script>
  window.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  });

  // すべてのファイル名
  const csvFiles = [
    "小学1年生その1", "小学1年生その2",
    "小学2年生その1", "小学2年生その2", "小学2年生その3", "小学2年生その4",
    "小学3年生その1", "小学3年生その2", "小学3年生その3", "小学3年生その4",
    "小学4年生その1", "小学4年生その2", "小学4年生その3", "小学4年生その4", "小学4年生その5",
    "小学5年生その1", "小学5年生その2", "小学5年生その3", "小学5年生その4",
    "小学6年生その1", "小学6年生その2", "小学6年生その3", "小学6年生その4"
  ];

  let quizData = [];
  let learnedSet = new Set();
  let activeIndices = [];
  let currentActivePointer = 0;
  let currentFileName = "";

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let painting = false;
  let lastX = 0;
  let lastY = 0;

  ctx.strokeStyle = "black";
  ctx.lineWidth = 5;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  // ★ken.html の描画ロジックを統合（タッチ・ペン対応の安定化）
  function getCoordinates(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = (e.touches && e.touches.length > 0) ? e.touches[0].clientX : e.clientX;
    const clientY = (e.touches && e.touches.length > 0) ? e.touches[0].clientY : e.clientY;

    // kanji.html のスケール調整は保持
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;

    return {
      x: (clientX - rect.left) * scaleX,
      y: (clientY - rect.top) * scaleY
    };
  }

  function startDrawing(e) {
    e.preventDefault();
    painting = true;
    const pos = getCoordinates(e);
    lastX = pos.x;
    lastY = pos.y;
  }

  function draw(e) {
    e.preventDefault();
    if (!painting) return;
    const pos = getCoordinates(e);

    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();

    lastX = pos.x;
    lastY = pos.y;
  }

  function stopDrawing() {
    painting = false;
    ctx.beginPath();
  }

  // マウス・タッチ・ペンすべてのイベントに対応 (ken.html 方式)
  canvas.addEventListener('mousedown', startDrawing);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDrawing);
  canvas.addEventListener('mouseout', stopDrawing);

  canvas.addEventListener('touchstart', startDrawing, { passive: false });
  canvas.addEventListener('touchmove', draw, { passive: false });
  canvas.addEventListener('touchend', stopDrawing);
  canvas.addEventListener('touchcancel', stopDrawing);


  function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    document.getElementById('answer-display').innerText = "?";
    document.getElementById('stroke-order-img').style.display = "none";
    document.getElementById('stroke-order-placeholder').style.display = "block";
  }

  function openFileSelector() {
    const listContainer = document.getElementById('modal-file-list');
    listContainer.innerHTML = "";

    csvFiles.forEach(fileName => {
      const btn = document.createElement('div');
      btn.className = "file-item";
      btn.innerText = fileName;
      btn.onclick = () => fetchCSVFromServer(fileName);
      listContainer.appendChild(btn);
    });

    document.getElementById('file-selector-modal').style.display = "flex";
  }

  function closeModal() {
    document.getElementById('file-selector-modal').style.display = "none";
  }

  function fetchCSVFromServer(fileName) {
    closeModal();
    currentFileName = fileName;

    fetch(`data/${fileName}.csv`)
      .then(response => {
        if (!response.ok) {
          throw new Error("ファイルが見つからない、またはサーバー制限（CORS）エラーです。");
        }
        return response.text();
      })
      .then(text => {
        parseCSVText(text);
      })
      .catch(error => {
        alert("エラー: " + error.message + "\n※HTMLと/dataフォルダが同じサーバーで実行されているか確認してください。");
      });
  }

  function parseCSVText(text) {
    const lines = text.split(/\r?\n/);
    const parsedData = [];

    for (let i = 0; i < lines.length; i++) {
      if (!lines[i].trim()) continue;
      const columns = lines[i].split(',');
      if (columns.length < 2) continue;

      const hintsArray = columns[0].split('|');
      const answer = columns[1].trim();
      const code = columns[2] ? columns[2].trim() : "";

      parsedData.push({ q: hintsArray, a: answer, code: code });
    }

    if (parsedData.length === 0) {
      alert("CSVデータが正しく解析できませんでした。");
      return;
    }

    quizData = parsedData.slice(0, 50);
    learnedSet.clear();
    rebuildActiveList(true);
    updateQuestion();
  }

  function showAnswer() {
    if (activeIndices.length === 0) return;
    const currentData = quizData[activeIndices[currentActivePointer]];
    document.getElementById('answer-display').innerText = currentData.a;

    const imgElement = document.getElementById('stroke-order-img');
    const placeholder = document.getElementById('stroke-order-placeholder');

    if (currentData.code) {
      const paddedCode = currentData.code.padStart(5, '0');
      imgElement.src = `https://raw.githubusercontent.com/KanjiVG/KanjiVG/master/kanji/${paddedCode}.svg`;
      imgElement.style.display = "block";
      placeholder.style.display = "none";
    }
  }

  function rebuildActiveList(goToFirst) {
    activeIndices = [];
    for (let i = 0; i < quizData.length; i++) {
      if (!learnedSet.has(i)) activeIndices.push(i);
    }
    if (goToFirst) currentActivePointer = 0;
    updateProgressDisplay();
  }

  function updateProgressDisplay() {
    document.getElementById('file-name-display').innerText = currentFileName ? `[ ${currentFileName} ]` : "[ なし ]";
    document.getElementById('progress-display').innerText = `ドリルしんちょく: ${learnedSet.size} / ${quizData.length}`;
  }

  function markAsLearned() {
    if (activeIndices.length === 0) return;
    learnedSet.add(activeIndices[currentActivePointer]);
    rebuildActiveList(false);
    if (activeIndices.length === 0) {
      document.getElementById('question').innerText = "ドリルを すべて クリア！";
      document.getElementById('hints').innerHTML = "おめでとう！ぜんぶ覚えたよ！";
      clearCanvas();
    } else {
      if (currentActivePointer >= activeIndices.length) currentActivePointer = 0;
      updateQuestion();
    }
  }

  function nextQuestion() {
    if (activeIndices.length === 0) return;
    currentActivePointer = (currentActivePointer + 1) % activeIndices.length;
    updateQuestion();
  }

  function resetQuiz() {
    if (activeIndices.length === 0) return;
    currentActivePointer = 0;
    updateQuestion();
  }

  function forgetAll() {
    if (quizData.length === 0) return;
    if (confirm("ドリルのきろくを すべて けしますか？")) {
      learnedSet.clear();
      rebuildActiveList(true);
      updateQuestion();
    }
  }

  function updateQuestion() {
    if (quizData.length === 0) return;
    if (activeIndices.length === 0) rebuildActiveList(true);
    const originalIdx = activeIndices[currentActivePointer];
    document.getElementById('question').innerText = "ドリル番号 " + (originalIdx + 1);
    document.getElementById('hints').innerHTML = quizData[originalIdx].q.join("<br>");
    clearCanvas();
  }

  updateProgressDisplay();
</script>
</body>
</html>
