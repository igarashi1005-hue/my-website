<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>都道府県ドリル - v1.3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body { 
      font-family: 'UD Digital Kyokasho-tai', 'Yu Mincho', 'Noto Sans JP', sans-serif; 
      /* 長押し＆テキスト選択禁止 */
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    
    .prefecture { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 0.8; transition: fill 0.3s ease; cursor: pointer; }
    .prefecture:hover { opacity: 0.8; }
    .prefecture.memorized { fill: #3b82f6; stroke: #1e3a8a; }
    .prefecture.active { fill: #ef4444; stroke: #b91c1c; stroke-width: 1.5; opacity: 1; }
    
    #drawing-pad {
      touch-action: none;
      /* Edgeでの黒画面バグ対策のため、背景の十字線はCSSではなくCanvasAPIで直接描画します */
    }
  </style>
</head>
<body class="bg-blue-50 h-screen flex flex-col overflow-hidden relative">

  <header class="bg-blue-600 text-white py-2 shadow-md z-10 flex justify-between px-6 items-center relative">
    
    <div class="w-1/3 flex justify-start">
      <button id="btn-restart" onclick="restartQuiz()" class="text-sm bg-blue-800 hover:bg-blue-900 text-white font-bold py-1 px-3 rounded-md shadow transition">
        最初に戻る
      </button>
    </div>
    
    <div class="w-1/3 text-center text-xl font-bold">
      <span>都道府県ドリル（手書き）</span>
    </div>

    <div class="w-1/3 flex justify-end items-center gap-2">
      <span id="question-counter" class="text-sm bg-white text-blue-600 px-3 py-1 rounded-full font-bold">第1問</span>
      <span id="memorized-counter" class="text-sm bg-yellow-300 text-blue-900 px-3 py-1 rounded-full border-2 border-yellow-400 font-bold">
        覚えた: 0 / 47
      </span>
    </div>

    <span class="absolute top-1 right-2 text-[10px] text-blue-200">v1.3</span>

  </header>

  <div class="flex-1 relative bg-blue-100 flex justify-center items-center overflow-hidden border-b-4 border-blue-300">
    <div id="loading" class="absolute text-lg font-bold text-gray-500">地図を読み込み中...</div>
    <div id="map-container" class="w-full h-full max-w-2xl relative"></div>
    <div class="absolute bottom-2 left-2 text-xs text-blue-800 font-bold bg-white/70 px-2 py-1 rounded">
      💡 地図をタップして問題を選べるよ！
    </div>
  </div>

  <div class="bg-gray-50 py-6 px-4 flex flex-col items-center justify-start flex-none h-[400px]">
    
    <div id="quiz-play-area" class="flex w-full max-w-5xl justify-center gap-10 items-start">
      
      <div class="flex flex-col items-center">
        <div class="flex justify-between w-full mb-1 px-1">
          <span class="text-sm font-bold text-gray-600">ここにペンで書こう（指では書けません）</span>
          <button onclick="clearCanvas()" class="text-sm text-gray-500 hover:text-red-500 underline">消しゴム</button>
        </div>
        <canvas id="drawing-pad" width="540" height="180" class="border-4 border-gray-400 bg-white rounded-lg shadow-inner cursor-crosshair"></canvas>
      </div>

      <div class="flex flex-col items-center justify-center w-80">
        <button id="btn-show-answer" onclick="showAnswer()" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 px-8 rounded-xl shadow-md text-xl w-full transition transform hover:scale-105 mt-6">
          答えを見る
        </button>
        
        <div id="correct-answer-area" class="hidden flex-col items-center w-full mt-2">
          <span class="text-sm font-bold text-gray-500">正解は…</span>
          <div id="correct-answer-ruby" class="text-xl font-bold text-red-500 tracking-wide mt-1"></div>
          <div id="correct-answer-text" class="text-5xl font-bold text-red-600 tracking-widest my-1"></div>
          
          <div class="flex gap-2 w-full mt-2">
            <button onclick="markMemorized()" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-xl shadow-md text-lg transition transform hover:scale-105">
              ⭕ 覚えた！
            </button>
            <button onclick="nextQuestion()" class="flex-1 bg-gray-400 hover:bg-gray-500 text-white font-bold py-3 rounded-xl shadow-md text-sm transition transform hover:scale-105">
              ❌ まだ(次へ)
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="quiz-finish-area" class="hidden flex-col items-center justify-center mt-10">
      <p class="text-3xl font-bold text-blue-600 mb-4">🎉 日本全国、ぜんぶ覚えた！おめでとう！</p>
      <button onclick="restartQuiz(true)" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-full shadow-lg text-xl transition transform hover:scale-105">
        最初からもういちど挑戦する
      </button>
    </div>

  </div>

  <script>
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    }, { passive: false });

    // 都道府県データ（ひらがなデータを追加）
    const prefecturesData = [
      { name: "北海道", ruby: "ほっかいどう" }, { name: "青森県", ruby: "あおもりけん" }, { name: "岩手県", ruby: "いわてけん" }, { name: "宮城県", ruby: "みやぎけん" }, { name: "秋田県", ruby: "あきたけん" },
      { name: "山形県", ruby: "やまがたけん" }, { name: "福島県", ruby: "ふくしまけん" }, { name: "茨城県", ruby: "いばらきけん" }, { name: "栃木県", ruby: "とちぎけん" }, { name: "群馬県", ruby: "ぐんまけん" },
      { name: "埼玉県", ruby: "さいたまけん" }, { name: "千葉県", ruby: "ちばけん" }, { name: "東京都", ruby: "とうきょうと" }, { name: "神奈川県", ruby: "かながわけん" }, { name: "新潟県", ruby: "にいがたけん" },
      { name: "富山県", ruby: "とやまけん" }, { name: "石川県", ruby: "いしかわけん" }, { name: "福井県", ruby: "ふくいけん" }, { name: "山梨県", ruby: "やまなしけん" }, { name: "長野県", ruby: "ながのけん" },
      { name: "岐阜県", ruby: "ぎふけん" }, { name: "静岡県", ruby: "しずおかけん" }, { name: "愛知県", ruby: "あいちけん" }, { name: "三重県", ruby: "みえけん" }, { name: "滋賀県", ruby: "しがけん" },
      { name: "京都府", ruby: "きょうとふ" }, { name: "大阪府", ruby: "おおさかふ" }, { name: "兵庫県", ruby: "ひょうごけん" }, { name: "奈良県", ruby: "ならけん" }, { name: "和歌山県", ruby: "わかやまけん" },
      { name: "鳥取県", ruby: "とっとりけん" }, { name: "島根県", ruby: "しまねけん" }, { name: "岡山県", ruby: "おかやまけん" }, { name: "広島県", ruby: "ひろしまけん" }, { name: "山口県", ruby: "やまぐちけん" },
      { name: "徳島県", ruby: "とくしまけん" }, { name: "香川県", ruby: "かがわけん" }, { name: "愛媛県", ruby: "えひめけん" }, { name: "高知県", ruby: "こうちけん" }, { name: "福岡県", ruby: "ふくおかけん" },
      { name: "佐賀県", ruby: "さがけん" }, { name: "長崎県", ruby: "ながさきけん" }, { name: "熊本県", ruby: "くまもとけん" }, { name: "大分県", ruby: "おおいたけん" }, { name: "宮崎県", ruby: "みやざきけん" },
      { name: "鹿児島県", ruby: "かごしまけん" }, { name: "沖縄県", ruby: "おきなわけん" }
    ];

    let currentIndex = 0;
    let memorizedSet = new Set();

    const width = 800;
    const height = 600;
    const svg = d3.select("#map-container").append("svg")
                  .attr("viewBox", `0 0 ${width} ${height}`)
                  .attr("width", "100%")
                  .attr("height", "100%");

    const projectionMain = d3.geoMercator()
                         .center([137.0, 38.2])
                         .scale(1500)
                         .translate([width / 2, height / 2]);
    const pathMain = d3.geoPath().projection(projectionMain);

    const projectionOkinawa = d3.geoMercator()
                         .center([127.8, 26.3]) 
                         .scale(2500) 
                         .translate([670, 505]); 
    const pathOkinawa = d3.geoPath().projection(projectionOkinawa);

    d3.json("https://raw.githubusercontent.com/dataofjapan/land/master/japan.geojson").then(function(json) {
      document.getElementById("loading").style.display = "none";
      
      svg.append("rect")
         .attr("x", 550)
         .attr("y", 420)
         .attr("width", 240)
         .attr("height", 170)
         .attr("fill", "none")
         .attr("stroke", "#94a3b8")
         .attr("stroke-width", 2)
         .attr("stroke-dasharray", "5,5");

      svg.selectAll("path")
         .data(json.features)
         .enter()
         .append("path")
         .attr("d", d => {
            if (d.properties.nam_ja === "沖縄県") {
              return pathOkinawa(d);
            }
            return pathMain(d);
         })
         .attr("class", "prefecture")
         .on("click", function(event, d) {
            const clickedName = d.properties.nam_ja;
            const targetIndex = prefecturesData.findIndex(p => p.name === clickedName);
            if (targetIndex !== -1) {
              currentIndex = targetIndex;
              loadQuestion();
            }
         });
         
      loadQuestion();
    });

    // --- 超低遅延・高速追従キャンバス処理 ---
    const canvas = document.getElementById("drawing-pad");
    // Edgeの真っ黒バグ対策: alpha: false を指定して透過を無効化する
    const ctx = canvas.getContext("2d", { desynchronized: true, alpha: false });
    let isDrawing = false;
    let lastX = 0;
    let lastY = 0;

    function getCanvasPos(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDrawing(e) {
      if (e.pointerType !== 'pen') return;
      e.preventDefault();
      isDrawing = true;
      const pos = getCanvasPos(e.clientX, e.clientY);
      lastX = pos.x;
      lastY = pos.y;
    }

    function draw(e) {
      if (e.pointerType !== 'pen') return;
      e.preventDefault();
      if (!isDrawing) return;
      
      const events = typeof e.getCoalescedEvents === 'function' ? e.getCoalescedEvents() : [e];
      
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      
      for (let ev of events) {
        const pos = getCanvasPos(ev.clientX, ev.clientY);
        ctx.lineTo(pos.x, pos.y);
        lastX = pos.x;
        lastY = pos.y;
      }
      
      ctx.stroke();
    }

    function stopDrawing(e) {
      if (e.pointerType !== 'pen') return;
      e.preventDefault();
      isDrawing = false;
    }

    canvas.addEventListener("pointerdown", startDrawing);
    canvas.addEventListener("pointermove", draw);
    canvas.addEventListener("pointerup", stopDrawing);
    canvas.addEventListener("pointerout", stopDrawing);

    canvas.addEventListener('touchstart', function(e) { e.preventDefault(); }, { passive: false });
    canvas.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });
    canvas.addEventListener('touchend', function(e) { e.preventDefault(); }, { passive: false });

    function clearCanvas() {
      // 背景を白で塗りつぶす（alpha: false対策）
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // 十字のガイド線を引く（CSSのグラデーションの代わり）
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#cbd5e1";
      ctx.beginPath();
      ctx.moveTo(0, canvas.height / 2);
      ctx.lineTo(canvas.width, canvas.height / 2);
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();

      // ペンの描画設定に戻す
      ctx.lineWidth = 3; 
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#1e293b"; 
    }

    // 初期読み込み時にキャンバスを白く塗りつぶし、十字線を引く
    clearCanvas();

    function loadQuestion() {
      const currentPref = prefecturesData[currentIndex];
      
      document.getElementById("question-counter").innerText = `第${currentIndex + 1}問`;
      updateProgressUI();
      clearCanvas();
      
      document.getElementById("btn-show-answer").style.display = "block";
      document.getElementById("correct-answer-area").classList.add("hidden");
      document.getElementById("correct-answer-area").classList.remove("flex");

      d3.selectAll(".prefecture").classed("active", false);
      d3.selectAll(".prefecture").filter(d => d.properties.nam_ja === currentPref.name).classed("active", true);
    }

    function showAnswer() {
      const currentPref = prefecturesData[currentIndex];
      document.getElementById("correct-answer-ruby").innerText = currentPref.ruby;
      document.getElementById("correct-answer-text").innerText = currentPref.name;
      
      document.getElementById("btn-show-answer").style.display = "none";
      document.getElementById("correct-answer-area").classList.remove("hidden");
      document.getElementById("correct-answer-area").classList.add("flex");
    }

    function markMemorized() {
      const currentPref = prefecturesData[currentIndex];
      memorizedSet.add(currentPref.name);
      d3.selectAll(".prefecture").filter(d => d.properties.nam_ja === currentPref.name).classed("memorized", true);
      nextQuestion();
    }

    function nextQuestion() {
      if (memorizedSet.size >= prefecturesData.length) {
        showFinishScreen();
        return;
      }
      let nextIndex = (currentIndex + 1) % prefecturesData.length;
      while (memorizedSet.has(prefecturesData[nextIndex].name) && memorizedSet.size < prefecturesData.length) {
        nextIndex = (nextIndex + 1) % prefecturesData.length;
      }
      currentIndex = nextIndex;
      loadQuestion();
    }

    function updateProgressUI() {
      document.getElementById("memorized-counter").innerText = `覚えた: ${memorizedSet.size} / 47`;
    }

    function showFinishScreen() {
      updateProgressUI();
      document.getElementById("quiz-play-area").classList.add("hidden");
      document.getElementById("quiz-play-area").classList.remove("flex");
      document.getElementById("quiz-finish-area").classList.remove("hidden");
      document.getElementById("quiz-finish-area").classList.add("flex");
      d3.selectAll(".prefecture").classed("active", false);
    }

    function restartQuiz(force = false) {
      if (force || confirm("進捗（青く塗った場所）もすべてリセットして最初からやりなおしますか？")) {
        currentIndex = 0;
        memorizedSet.clear(); 
        d3.selectAll(".prefecture").classed("memorized", false);
        
        document.getElementById("quiz-play-area").classList.remove("hidden");
        document.getElementById("quiz-play-area").classList.add("flex");
        document.getElementById("quiz-finish-area").classList.add("hidden");
        document.getElementById("quiz-finish-area").classList.remove("flex");
        
        loadQuestion();
      }
    }
  </script>
</body>
</html>
